name: Publier le site du club sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.media.outputs.ready }}
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v6
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances vérifiées
        run: npm ci
      - name: Vérifier le code du site
        run: npm run typecheck
      - name: Contrôler les adresses externes des médias
        id: media
        run: node scripts/check-pages-media-config.mjs
        env:
          PAGES_MEDIA_BASE_URL: ${{ vars.PAGES_MEDIA_BASE_URL }}
          PAGES_MEDIA_MAP_FILE: ${{ vars.PAGES_MEDIA_MAP_FILE }}
      - name: Lire la configuration GitHub Pages
        if: steps.media.outputs.ready == 'true'
        id: pages
        uses: actions/configure-pages@v5
      - name: Construire le site public
        if: steps.media.outputs.ready == 'true'
        run: node scripts/build-github-pages.mjs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
          PAGES_MEDIA_BASE_URL: ${{ vars.PAGES_MEDIA_BASE_URL }}
          PAGES_MEDIA_MAP_FILE: ${{ vars.PAGES_MEDIA_MAP_FILE }}
          PAGES_CLUB_URL: ${{ vars.PAGES_CLUB_URL }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Vérifier les fichiers à publier
        if: steps.media.outputs.ready == 'true'
        run: node scripts/check-github-pages.mjs
      - name: Préparer la publication
        if: steps.media.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: outputs/hippocampes-github-pages/www

  deploy:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
