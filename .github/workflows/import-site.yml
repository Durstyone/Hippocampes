name: Initialiser les sources du site du club

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: initialiser-site-hippocampes
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'Durstyone/Hippocampes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire le depot
        uses: actions/checkout@v6
      - name: Verifier et extraire les sources publiques
        run: |
          python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          archive = root / 'site-source.zip'
          if (root / 'package.json').exists():
              raise SystemExit('Import deja effectue : aucune source existante ne sera remplacee.')
          expected = '274addb6f3b432ce930d50aa883a3ffda840dac82f94a974611330c0bcb174d5'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Le lot de sources ne correspond pas a la version verifiee.')
          allowed = {'app', 'docs', 'github-pages', 'lib', 'public', 'scripts', '.gitignore', 'README.md', 'PREPARATION.json', 'package.json', 'package-lock.json', 'postcss.config.mjs', 'tsconfig.json'}
          forbidden = {'.git', '.github', '.openai', '.wrangler', 'node_modules'}
          forbidden_extensions = {'.mp4', '.webm', '.mov', '.m4v', '.ogv', '.sqlite', '.db', '.pem', '.key'}
          image_extensions = {'.jpg', '.jpeg', '.png', '.gif', '.webp', '.avif', '.heic'}
          with zipfile.ZipFile(archive) as zipped:
              entries = zipped.infolist()
              local_images = set(json.loads(zipped.read('github-pages/local-media.json'))['files'])
              if len(entries) != 189 or sum(i.file_size for i in entries) > 20000000:
                  raise SystemExit('Inventaire de sources inattendu.')
              for item in entries:
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or not path.parts or '..' in path.parts or '\\' in item.filename:
                      raise SystemExit('Chemin refuse.')
                  if path.parts[0] not in allowed or forbidden.intersection(path.parts):
                      raise SystemExit('Dossier refuse.')
                  if any(p.startswith('.env') for p in path.parts) or path.suffix.lower() in forbidden_extensions:
                      raise SystemExit('Fichier prive ou media refuse.')
                  if path.suffix.lower() in image_extensions:
                      if path.parts[0] != 'public' or '/' + path.relative_to('public').as_posix() not in local_images:
                          raise SystemExit('Image non prevue dans les actualites.')
                  if stat.S_ISLNK(item.external_attr >> 16) or item.is_dir():
                      raise SystemExit('Entree speciale refusee.')
                  if (root / path).exists():
                      raise SystemExit('Un fichier de destination existe deja : import interrompu.')
              for item in entries:
                  destination = root / item.filename
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with destination.open('xb') as target:
                      target.write(zipped.read(item))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## Sources du club importees\n\n{len(entries)} fichiers publics et {len(local_images)} images des actualites conservees. Aucun serveur prive ni video dans le depot.\n')
          PY
      - name: Enregistrer les sources dans le depot du club
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app docs github-pages lib public scripts .gitignore README.md PREPARATION.json package.json package-lock.json postcss.config.mjs tsconfig.json
          git rm -- site-source.zip
          git commit -m 'Importer le site public des Hippocampes du Robec'
          git push origin HEAD:main
